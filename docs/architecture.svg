<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="980" height="700" fill="#ffffff"/>
  <text x="490" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Secure AWS Application Infrastructure (Terraform)</text>

  <!-- Internet -->
  <rect x="20" y="70" width="110" height="60" rx="8" fill="#eef2f7" stroke="#4a5568"/>
  <text x="75" y="105" text-anchor="middle" font-weight="bold">Internet users</text>
  <line x1="130" y1="100" x2="190" y2="100" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="92" text-anchor="middle" font-size="10" fill="#2b6cb0">HTTPS 443</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#718096"/></marker>
  </defs>

  <!-- AWS region / VPC -->
  <rect x="150" y="45" width="650" height="630" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="160" y="62" font-weight="bold" fill="#c05621">AWS Region (ap-south-1)</text>
  <rect x="165" y="70" width="620" height="590" rx="10" fill="#f7fbff" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="175" y="88" font-weight="bold" fill="#2b6cb0">VPC 10.0.0.0/16  (Flow Logs → CloudWatch)</text>

  <!-- WAF + IGW -->
  <rect x="190" y="75" width="0" height="0"/>
  <rect x="190" y="100" width="90" height="0"/>

  <!-- Public tier -->
  <rect x="185" y="105" width="580" height="150" rx="8" fill="#e6fffa" stroke="#2c7a7b"/>
  <text x="195" y="123" font-weight="bold" fill="#285e61">Public subnets (AZ-a, AZ-b)</text>
  <rect x="205" y="135" width="90" height="40" rx="6" fill="#fff" stroke="#2c7a7b"/><text x="250" y="160" text-anchor="middle">Internet GW</text>
  <rect x="320" y="135" width="190" height="105" rx="6" fill="#fff" stroke="#2c7a7b" stroke-width="2"/>
  <text x="415" y="157" text-anchor="middle" font-weight="bold">Application Load Balancer</text>
  <text x="415" y="175" text-anchor="middle" font-size="11">+ AWS WAF (managed rules, rate limit)</text>
  <text x="415" y="193" text-anchor="middle" font-size="11">TLS 1.2/1.3, access logs → S3</text>
  <text x="415" y="211" text-anchor="middle" font-size="10" fill="#555">SG: 80/443 from allowed CIDRs</text>
  <rect x="540" y="135" width="205" height="50" rx="6" fill="#fff" stroke="#2c7a7b"/>
  <text x="642" y="157" text-anchor="middle">NAT Gateway(s)</text>
  <text x="642" y="173" text-anchor="middle" font-size="10" fill="#555">egress only for app tier</text>
  <line x1="295" y1="155" x2="320" y2="155" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a)"/>

  <!-- App tier -->
  <rect x="185" y="285" width="580" height="150" rx="8" fill="#ebf8ff" stroke="#2b6cb0"/>
  <text x="195" y="303" font-weight="bold" fill="#2a4365">Private app subnets (AZ-a, AZ-b)  – no public IPs</text>
  <rect x="205" y="315" width="330" height="105" rx="6" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="370" y="336" text-anchor="middle" font-weight="bold">ECS Cluster (Fargate, Container Insights)</text>
  <rect x="220" y="347" width="140" height="40" rx="5" fill="#ebf8ff" stroke="#2b6cb0"/><text x="290" y="372" text-anchor="middle" font-size="11">Task (app) – AZ-a</text>
  <rect x="380" y="347" width="140" height="40" rx="5" fill="#ebf8ff" stroke="#2b6cb0"/><text x="450" y="372" text-anchor="middle" font-size="11">Task (app) – AZ-b</text>
  <text x="370" y="408" text-anchor="middle" font-size="10" fill="#555">SG: app port from ALB SG only · autoscaling on CPU</text>
  <rect x="560" y="315" width="190" height="105" rx="6" fill="#fff" stroke="#6b46c1"/>
  <text x="655" y="337" text-anchor="middle" font-weight="bold" fill="#553c9a">IAM roles</text>
  <text x="655" y="357" text-anchor="middle" font-size="11">Execution role (ECR, logs,</text>
  <text x="655" y="372" text-anchor="middle" font-size="11">this secret, KMS decrypt)</text>
  <text x="655" y="392" text-anchor="middle" font-size="11">Task role (no permissions by default)</text>
  <line x1="415" y1="240" x2="415" y2="347" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a)"/>
  <text x="425" y="275" font-size="10" fill="#2b6cb0">app port</text>

  <!-- DB tier -->
  <rect x="185" y="465" width="580" height="110" rx="8" fill="#fff5f5" stroke="#c53030"/>
  <text x="195" y="483" font-weight="bold" fill="#9b2c2c">Private DB subnets (AZ-a, AZ-b) – no route to internet</text>
  <rect x="205" y="495" width="170" height="65" rx="6" fill="#fff" stroke="#c53030" stroke-width="2"/>
  <text x="290" y="520" text-anchor="middle" font-weight="bold">RDS PostgreSQL</text>
  <text x="290" y="537" text-anchor="middle" font-size="11">Primary (AZ-a), encrypted</text>
  <text x="290" y="551" text-anchor="middle" font-size="10" fill="#555">SG: 5432 from ECS SG only</text>
  <rect x="395" y="495" width="170" height="65" rx="6" fill="#fff" stroke="#c53030"/>
  <text x="480" y="520" text-anchor="middle" font-weight="bold">Multi-AZ standby</text>
  <text x="480" y="537" text-anchor="middle" font-size="11">Sync replication (AZ-b)</text>
  <line x1="375" y1="527" x2="395" y2="527" stroke="#718096" stroke-width="2" marker-end="url(#g)"/>
  <line x1="290" y1="420" x2="290" y2="495" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="460" font-size="10" fill="#2b6cb0">5432 (TLS enforced)</text>

  <!-- Shared services -->
  <rect x="580" y="495" width="170" height="65" rx="6" fill="#fff" stroke="#718096"/>
  <text x="665" y="520" text-anchor="middle" font-weight="bold">Secrets Manager</text>
  <text x="665" y="537" text-anchor="middle" font-size="11">RDS master secret</text>
  <text x="665" y="551" text-anchor="middle" font-size="10" fill="#555">injected into tasks at start</text>

  <rect x="185" y="595" width="580" height="55" rx="8" fill="#faf5ff" stroke="#6b46c1"/>
  <text x="195" y="613" font-weight="bold" fill="#553c9a">Security, logging &amp; monitoring (regional services)</text>
  <text x="195" y="632" font-size="11">KMS CMK (rotation on) · CloudWatch Logs (KMS, 365d) · Alarms → SNS (encrypted) · S3 ALB logs · Flow Logs</text>
  <text x="195" y="645" font-size="11">Tags on everything: Project, Environment, Owner, CostCenter, DataClassification, ManagedBy</text>

  <!-- Legend -->
  <rect x="820" y="70" width="150" height="140" rx="6" fill="#fff" stroke="#cbd5e0"/>
  <text x="830" y="90" font-weight="bold">Legend</text>
  <rect x="830" y="100" width="14" height="10" fill="#e6fffa" stroke="#2c7a7b"/><text x="850" y="109" font-size="11">Public tier</text>
  <rect x="830" y="120" width="14" height="10" fill="#ebf8ff" stroke="#2b6cb0"/><text x="850" y="129" font-size="11">Private app tier</text>
  <rect x="830" y="140" width="14" height="10" fill="#fff5f5" stroke="#c53030"/><text x="850" y="149" font-size="11">Private data tier</text>
  <rect x="830" y="160" width="14" height="10" fill="#faf5ff" stroke="#6b46c1"/><text x="850" y="169" font-size="11">Security / ops</text>
  <line x1="830" y1="188" x2="848" y2="188" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a)"/><text x="856" y="192" font-size="11">Allowed flow</text>
</svg>
